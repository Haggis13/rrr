name: Probe Actions
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u > action-probe.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add action-probe.txt
          git commit -m "Actions probe" || true
          git push
